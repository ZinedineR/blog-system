paths:
  /comments:
    get:
      consumes:
      - application/json
      description: Finds comments in the system with a paginated list with optional
        filters and sorting
      parameters:
      - description: Offset for pagination
        in: query
        name: offset
        type: integer
      - description: Limit for pagination
        in: query
        name: limit
        type: integer
      - description: 'Filter rules<br><br>### Format:<br>{field}:{value}:{operator}<br>Supported
          operators: eq, lt, gt, lte, gte, in, like, is, not'
        in: query
        name: filter
        type: string
      - description: 'Sort rules<br><br>### Format:<br>{field}:{direction}<br>Supported
          directions: asc, desc'
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/blog-system_internal_delivery_http_response.PaginationResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/blog-system_internal_model.GetCommentByIDRes'
                  type: array
              type: object
        "400":
          description: error
          schema:
            $ref: '#/definitions/blog-system_internal_delivery_http_response.ErrorResponse'
      summary: Find comments
      tags:
      - Comment
    post:
      consumes:
      - application/json
      description: Creates a new comment in the system
      parameters:
      - description: Create Comment Request
        in: body
        name: comment
        required: true
        schema:
          $ref: '#/definitions/blog-system_internal_model.CreateCommentReq'
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/blog-system_internal_delivery_http_response.DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/blog-system_internal_model.CreateCommentRes'
              type: object
        "400":
          description: error
          schema:
            $ref: '#/definitions/blog-system_internal_delivery_http_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a new comment
      tags:
      - Comment
  /comments/{id}:
    delete:
      consumes:
      - application/json
      description: Deletes a comment in the system
      parameters:
      - description: Comment ID
        in: path
        name: id
        required: true
        type: string
      produces:
