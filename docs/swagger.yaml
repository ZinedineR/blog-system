      description: Updates a comment in the system
      parameters:
      - description: Comment ID
        in: path
        name: id
        required: true
        type: string
      - description: Update Comment Request
        in: body
        name: comment
        required: true
        schema:
          $ref: '#/definitions/blog-system_internal_model.UpdateCommentReq'
      produces:
